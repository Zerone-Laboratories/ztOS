# devices.ztos.online: the ztOS wiki's Supported Devices. src/worker.js sends
# public/index.html for every address with that page's title, description and
# structured data, and makes sitemap.xml and robots.txt; the device entries
# come from https://ztos.online/devices/.
name = "ztos-devices-site"
main = "src/worker.js"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[routes]]
pattern = "devices.ztos.online"
custom_domain = true
