# Merged by install.sh; unrelated existing properties are preserved.
[waydroid]
suspend_action = freeze

[properties]
ro.zygote = zygote64
ro.product.cpu.abilist = arm64-v8a
ro.product.cpu.abilist64 = arm64-v8a
ro.product.cpu.abilist32 =
ro.config.low_ram = true
ro.lmk.use_psi = true
ro.lmk.psi_partial_stall_ms = 150
ro.lmk.psi_complete_stall_ms = 500
ro.lmk.kill_heaviest_task = true
ro.lmk.kill_timeout_ms = 1000
ro.product.brand_for_attestation = waydroid
ro.product.device_for_attestation = waydroid_arm64
ro.product.manufacturer_for_attestation = Waydroid
ro.product.model_for_attestation = Samsung Galaxy S9 (SM-G960N)
ro.product.name_for_attestation = lineage_waydroid_arm64
ro.product.product_for_attestation = lineage_waydroid_arm64
dalvik.vm.heapstartsize = 8m
dalvik.vm.heapgrowthlimit = 128m
dalvik.vm.heapsize = 256m
persist.waydroid.multi_windows = true
persist.waydroid.width = 360
persist.waydroid.height = 672
ro.sf.lcd_density = 560
ro.hardware.gralloc = gbm
ro.hardware.egl = mesa
ro.hardware.vulkan =
debug.renderengine.backend = skiaglthreaded
persist.waydroid.suspend = true
# Bootanimation exhausted Panfrost allocations on this 3.5 GB device.
debug.sf.nobootanimation = 1
# Keep less unused space in each ART heap; retain the existing app heap limits.
dalvik.vm.heaptargetutilization = 0.75
dalvik.vm.heapminfree = 2m
dalvik.vm.heapmaxfree = 8m
ro.lmk.use_minfree_levels = false
persist.waydroid.no_background_subsurface = true
# Production base does not need Perfetto trace collection.
persist.traced.enable = 0

