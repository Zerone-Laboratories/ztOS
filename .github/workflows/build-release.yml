name: Build and Release ztOS

on:
  push:
    branches:
      - main
    # the website and its device list (accepted entries commit there) need no new image
    paths-ignore:
      - 'docs/**'
      - 'services/**'
      - '**.md'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave empty to use VERSION file)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-release:
    name: Build ztOS Images & Publish Release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            dosfstools \
            e2fsprogs \
            flex \
            libarchive-tools \
            libelf-dev \
            libssl-dev \
            mtools \
            qemu-user-static \
            binfmt-support \
            util-linux \
            xz-utils \
            zstd \
            curl \
            python3

      - name: Configure namespaces and mount propagation
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo mount --make-rprivate /
          sudo usermod --add-subuids 100000-165535 runner || true
          sudo usermod --add-subgids 100000-165535 runner || true

      - name: Set up QEMU ARM64 binfmt
        run: |
          sudo systemctl restart systemd-binfmt.service || true
          cat /proc/sys/fs/binfmt_misc/qemu-aarch64 || true

      - name: Build ztOS for Samsung Galaxy S9 (starlte)
        run: |
          echo "=== Building S9 (starlte) rootfs ==="
          sudo python3 installer/ztos build --target starlte --user zerone --password toor --hostname ztos --timezone UTC

      - name: Build ztOS for QEMU Emulator (qemu)
        run: |
          echo "=== Building QEMU disk image ==="
          sudo python3 installer/ztos build --target qemu --user zerone --password toor --hostname ztos --timezone UTC

      - name: Package and compress release assets
        run: |
          mkdir -p release-assets

          echo "=== Packaging S9 (starlte) ==="
          if [ -f prebuilts/boot/ztos-starlte-boot.img ]; then
            cp prebuilts/boot/ztos-starlte-boot.img release-assets/ztos-starlte-boot.img
          elif [ -f out/ztos-boot.img ]; then
            cp out/ztos-boot.img release-assets/ztos-starlte-boot.img
          fi
          sudo zstd -T0 -15 build/ztos/starlte/root.img -o release-assets/ztos-starlte-root.img.zst
          sudo xz -T0 -9 -k build/ztos/starlte/root.img
          sudo mv build/ztos/starlte/root.img.xz release-assets/ztos-starlte-root.img.xz

          echo "=== Packaging QEMU Emulator ==="
          sudo zstd -T0 -15 build/ztos/qemu/ztos-qemu.img -o release-assets/ztos-qemu.img.zst
          sudo xz -T0 -9 -k build/ztos/qemu/ztos-qemu.img
          sudo mv build/ztos/qemu/ztos-qemu.img.xz release-assets/ztos-qemu.img.xz

          echo "=== Calculating SHA256 checksums ==="
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cd ..

      - name: Determine tag name and ensure tag exists
        id: vars
        run: |
          VER=$(cat VERSION | tr -d '[:space:]')
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$VER"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Using release tag: $TAG"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Creating and pushing tag $TAG..."
            git tag "$TAG"
            git push origin "$TAG" || true
          fi

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ztOS ${{ steps.vars.outputs.tag }}
          body: |
            ## ztOS Release ${{ steps.vars.outputs.tag }}
            
            Official prebuilt system and boot images for ztOS Mobile.
            
            ### Default Credentials:
            * **Username:** `zerone`
            * **Password:** `toor`
            * **Sudo:** `zerone` has full sudo privileges (`toor`).
            
            ---
            
            ### Included Packages & Separate Target Images:
            
            #### 1. Samsung Galaxy S9 (starlte)
            * **`ztos-starlte-boot.img`**: Mainline 7.1 Linux kernel boot image for `BOOT` partition.
            * **`ztos-starlte-root.img.zst` / `.xz`**: Full 10 GB Arch Linux ARM rootfs with ztMETRO shell, drivers and native apps.
            
            #### 2. QEMU PC Emulator (ARM64 virt)
            * **`ztos-qemu.img.zst` / `.xz`**: Preconfigured GPT disk image with EFI bootloader, ready to boot via `installer/ztos emulator`.
            
            #### Checksums:
            * **`SHA256SUMS.txt`**: Verification hashes for all assets.
            
            ---
            
            ### Quick Installation:
            Run `installer/ztos install` and choose **1. Auto Download Prebuilt image and install**.
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
