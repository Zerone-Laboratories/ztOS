<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- ztOSIAL: root owns org.ztos.ial; everyone may read it and call it. The
     phone has one user, who runs the shell; methods that change hardware are
     open to that user as they were through the files before. -->
<busconfig>
  <policy user="root">
    <allow own="org.ztos.ial"/>
    <allow own_prefix="org.ztos.ial"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.ztos.ial"/>
    <allow send_destination_prefix="org.ztos.ial"/>
  </policy>
</busconfig>
