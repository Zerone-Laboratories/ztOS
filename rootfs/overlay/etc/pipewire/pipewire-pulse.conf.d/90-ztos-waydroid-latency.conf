# Waydroid's Android audio connects through the PulseAudio server, so the
# node rule in pipewire.conf.d does not reach it: give its streams 2048-frame
# (42.7 ms) minimum buffers here. With the 256 frames it asks for, Android's
# writes blocked for hundreds of ms ("AudioFlinger: write blocked") and its
# stream was torn down and reopened many times a second, loading PipeWire and
# WirePlumber until the speaker missed its deadlines.
pulse.rules = [
  {
    matches = [ { application.name = "Waydroid" } ]
    actions = {
      update-props = {
        pulse.min.req     = 2048/48000
        pulse.min.frag    = 2048/48000
        pulse.min.quantum = 2048/48000
      }
    }
  }
]
