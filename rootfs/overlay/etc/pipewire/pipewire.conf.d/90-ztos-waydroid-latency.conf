# Waydroid's ALSA Playback stream requests 256 frames; the ABOX graph then
# runs at 512 frames and reports sink errors during Android playback. Raise
# only the Waydroid node latency to 2048 frames (42.7 ms). Keyboard taps stay
# unchanged.
node.rules = [
  {
    matches = [ { node.name = "Waydroid" } ]
    actions = {
      update-props = {
        node.latency = 2048/48000
      }
    }
  }
]
