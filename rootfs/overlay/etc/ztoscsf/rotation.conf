# ztoscsf-sensord: auto rotation (AOSP's WindowOrientationListener, a little faster).
# key = value; # starts a comment; a missing key keeps its default, an unknown
# one is logged and ignored. Read at start and on `rotation reload`:
#   echo 'rotation reload' > /run/ztoscsf-sensord.ctl
# Angles in degrees, times in ms, accelerations in g.

# The hub's raw axes in the device frame (x toward the right edge, y toward the
# top edge, z out of the screen): each device axis is a raw axis, signed,
# e.g. "-y x z". Not yet measured on the S9.
axes = -x y -z
# raw counts per g (the hub's accelerometer: about 4096)
lsb_per_g = 4096

# the accelerometer's period while rotation streams, and the low-pass filter
period_ms = 40
tau_ms = 150
# more than this between readings starts the filter again
max_gap_ms = 1000

# below this |a| the phone is falling: no candidate
near_zero = 0.10
# |a| outside mag_lo..mag_hi is movement: nothing is committed for accel_hold_ms after
mag_lo = 0.59
mag_hi = 1.41
accel_hold_ms = 500

# tilt (+90 face up, -90 face down): beyond max_tilt either way no candidate
max_tilt = 80
# held overhead (screen facing down): below overhead_enter until above overhead_exit
overhead_enter = -40
overhead_exit = -15
# the tilt each orientation is taken at: LOW HIGH
tilt_tol_0 = -25 70
tilt_tol_90 = -25 65
tilt_tol_180 = -25 60
tilt_tol_270 = -25 65

# flat (tilt >= flat_deg for flat_ms): nothing for after_flat_ms after it is lifted
flat_deg = 80
flat_ms = 1000
after_flat_ms = 500
# tilted toward flat by swing_deg within swing_ms: nothing for after_swing_ms
swing_deg = 20
swing_ms = 300
after_swing_ms = 300

# into a neighbouring orientation only gap_deg / 2 past the 45-degree midpoint
gap_deg = 45
# a candidate must hold this long; changes at least min_interval_ms apart
settle_ms = 80
min_interval_ms = 600
# upside-down portrait
allow_180 = 0
# after the screen comes on, readings that must agree before the first ("instant") decision
start_samples = 3
