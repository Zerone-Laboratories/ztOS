# ztOS crash policy for long-running services (put in place by zrn-crash-apply):
# start again after a crash, tell the shell each time, and stop after five
# crashes in ten minutes. The counting is zrn-crash-notify's; systemd's own
# start limit is switched off here, because it counts every start, wanted or not.
[Unit]
StartLimitIntervalSec=0
[Service]
Restart=on-failure
RestartSec=3
ExecStopPost=-/usr/local/sbin/zrn-crash-notify %n
