# ALSA configuration for Samsung Galaxy S9 (starlte)
# Default PCM output to the ZrnAbox speaker device

pcm.!default {
    type asym
    playback.pcm {
        type plug
        slave {
            pcm "hw:ZrnAbox,0"
            rate 48000
            channels 2
            format S16_LE
        }
    }
}

ctl.!default {
    type hw
    card "ZrnAbox"
}
