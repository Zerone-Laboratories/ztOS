# The S9's two speakers as Samsung uses them: the bottom speaker (right
# amplifier, 0x3a) is the woofer, the earpiece (left, 0x39) cannot play bass.
# A Linkwitz-Riley (24 dB/octave) crossover at 800 Hz: the earpiece gets the
# left channel above it, the bottom speaker the right channel above it plus
# the bass of both (crossfeed), so nothing below 800 Hz is lost and the sum
# stays flat. Then, as interim speaker protection until Samsung's DSM runs:
# a 150 Hz high-pass on the bottom speaker (cone excursion grows fast below
# its useful range) and a lookahead peak limiter at -1 dBFS (LSP), so the
# louder amplifier settings never clip or overdrive the speakers.
# One fixed node: the default output, playing into the ABOX sink.
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Speaker"
      media.name       = "Speaker"
      filter.graph = {
        nodes = [
          { type = builtin name = copyL label = copy }
          { type = builtin name = copyR label = copy }
          { type = builtin name = hpL1 label = bq_highpass control = { "Freq" = 800.0 "Q" = 0.707 } }
          { type = builtin name = hpL2 label = bq_highpass control = { "Freq" = 800.0 "Q" = 0.707 } }
          { type = builtin name = hpR1 label = bq_highpass control = { "Freq" = 800.0 "Q" = 0.707 } }
          { type = builtin name = hpR2 label = bq_highpass control = { "Freq" = 800.0 "Q" = 0.707 } }
          { type = builtin name = bass label = mixer control = { "Gain 1" = 0.5 "Gain 2" = 0.5 } }
          { type = builtin name = lp1 label = bq_lowpass control = { "Freq" = 800.0 "Q" = 0.707 } }
          { type = builtin name = lp2 label = bq_lowpass control = { "Freq" = 800.0 "Q" = 0.707 } }
          { type = builtin name = woofer label = mixer control = { "Gain 1" = 1.0 "Gain 2" = 1.0 } }
          { type = builtin name = guard label = bq_highpass control = { "Freq" = 150.0 "Q" = 0.707 } }
          { type = ladspa name = limit plugin = "/usr/lib/ladspa/lsp-plugins-ladspa.so"
            label = "http://lsp-plug.in/plugins/ladspa/limiter_stereo"
            control = { "Threshold (G)" = 0.891 "Gain boost" = 0 "Lookahead (ms)" = 5.0
                        "Automatic level regulation" = 1 "Oversampling" = 0 "Dithering" = 0 } }
        ]
        links = [
          { output = "copyL:Out" input = "hpL1:In" }
          { output = "hpL1:Out"  input = "hpL2:In" }
          { output = "copyR:Out" input = "hpR1:In" }
          { output = "hpR1:Out"  input = "hpR2:In" }
          { output = "copyL:Out" input = "bass:In 1" }
          { output = "copyR:Out" input = "bass:In 2" }
          { output = "bass:Out"  input = "lp1:In" }
          { output = "lp1:Out"   input = "lp2:In" }
          { output = "hpR2:Out"  input = "woofer:In 1" }
          { output = "lp2:Out"   input = "woofer:In 2" }
          { output = "woofer:Out" input = "guard:In" }
          { output = "hpL2:Out"  input = "limit:Input L" }
          { output = "guard:Out" input = "limit:Input R" }
        ]
        inputs  = [ "copyL:In" "copyR:In" ]
        outputs = [ "limit:Output L" "limit:Output R" ]
      }
      capture.props = {
        node.name         = "ztos-speaker"
        media.class       = "Audio/Sink"
        audio.position    = [ FL FR ]
        priority.session  = 1009
        priority.driver   = 1009
      }
      playback.props = {
        node.name         = "ztos-speaker.out"
        target.object     = "alsa_output.platform-snd-zrn-abox.stereo-fallback"
        node.passive      = true
        node.dont-reconnect = false
        audio.position    = [ FL FR ]
        stream.dont-remix = true
      }
    }
  }
]
