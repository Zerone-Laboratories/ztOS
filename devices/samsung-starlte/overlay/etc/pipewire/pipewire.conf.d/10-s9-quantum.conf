# ABOX uses 512-frame IRQ periods for responsive taps. Permit that smaller graph
# while retaining the larger default for outputs that use timer scheduling.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum       = 2048
    default.clock.min-quantum   = 512
    default.clock.max-quantum   = 2048
}
