# Keep the established source name so PulseAudio/Waydroid saved defaults survive.
# A single capture filter avoids the WebRTC monitor's second clock dependency.
# +18 dB software gain follows the codec's +24 dB; the limiter caps peaks at -1 dBFS.
context.modules = [
    { name = libpipewire-module-filter-chain
      args = {
        node.description = "Microphone (processed)"
        audio.rate = 48000
        audio.channels = 1
        audio.position = [ MONO ]
        node.latency = 1024/48000
        filter.graph = {
            nodes = [
                { type = builtin name = hp label = bq_highpass
                  control = { "Freq" = 100.0 "Q" = 0.707 } }
                { type = ladspa name = limit
                  plugin = "/usr/lib/ladspa/lsp-plugins-ladspa.so"
                  label = "http://lsp-plug.in/plugins/ladspa/limiter_mono"
                  control = {
                    "Input gain (G)" = 8.0
                    "Threshold (G)" = 0.891
                    "Gain boost" = 0
                    "Lookahead (ms)" = 5.0
                    "Automatic level regulation" = 1
                    "Oversampling" = 0
                    "Dithering" = 0
                  }
                }
            ]
            links = [ { output = "hp:Out" input = "limit:Input" } ]
            inputs = [ "hp:In" ]
            outputs = [ "limit:Output" ]
        }
        capture.props = {
            node.name = "s9-microphone-agc.capture"
            target.object = "s9-microphone"
            node.passive = true
            node.dont-reconnect = false
        }
        playback.props = {
            node.name = "s9-microphone-agc"
            node.description = "Microphone (processed)"
            media.class = "Audio/Source"
            priority.session = 2100
        }
      }
    }
]
