# The microphone as apps and Waydroid hear it: s9-microphone through WebRTC's
# processing, as Samsung's own path does in its DSP. Their codec gain stops at
# +21.5 dB (mixer_gains.xml, gain-recognition-mic 171) and media recording runs
# it at -20 dB (88): the loudness on stock comes from processing after the
# codec, automatic gain control above all. Raw capture stays s9-microphone.
context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            node.latency = 1024/48000
            monitor.mode = true
            aec.args = {
                webrtc.gain_control = true
                webrtc.experimental_agc = true
                webrtc.noise_suppression = true
                webrtc.high_pass_filter = true
                webrtc.extended_filter = true
                webrtc.delay_agnostic = true
            }
            audio.rate = 48000
            audio.channels = 1
            audio.position = [ MONO ]
            capture.props = {
                node.name = "s9-microphone-agc.capture"
                target.object = "s9-microphone"
                node.passive = true
            }
            source.props = {
                node.name = "s9-microphone-agc"
                node.description = "Microphone (processed)"
                priority.session = 2100
            }
            sink.props = {
                node.name = "s9-microphone-agc.sink"
                node.passive = true
            }
            playback.props = {
                node.name = "s9-microphone-agc.playback"
                node.passive = true
            }
        }
    }
]
