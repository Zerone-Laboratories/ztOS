# The Galaxy S9's microphones (snd-zrn-abox capture=1: hw:ZrnAbox,2, DMIC1
# left, DMIC3 right, through the CS47L93 codec and ABOX WDMA1). The card's
# default profile only opens the speakers (device 0), so the microphone is
# its own source node.
context.objects = [
    {   factory = adapter
        args = {
            factory.name           = api.alsa.pcm.source
            node.name              = "s9-microphone"
            node.description       = "Microphone"
            media.class            = "Audio/Source"
            api.alsa.path          = "hw:ZrnAbox,2"
            audio.format           = "S16LE"
            audio.rate             = 48000
            audio.channels         = 2
            audio.position         = [ FL FR ]
            api.alsa.period-size   = 1024
            api.alsa.headroom      = 0
            node.suspend-on-idle   = true
            session.suspend-timeout-seconds = 3
            priority.session       = 2000
            priority.driver        = 2000
        }
    }
]
