# ABOX timer scheduling underruns. Use period interrupts with a small safety
# margin. Eight periods retain room for clients requesting larger blocks,
# without adding that whole ring capacity to playback delay. Other devices
# are unchanged.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.platform-snd-zrn-abox.*" }
    ]
    actions = {
      update-props = {
        api.alsa.disable-tsched = true
        api.alsa.period-size = 512
        api.alsa.period-num = 8
        api.alsa.headroom = 256
      }
    }
  }
]
