# ztOS on the Fujitsu ARROWS Tab: a systemd initramfs (rd.emergency=reboot
# works there) with i915 early. No autodetect, as it is built elsewhere, and
# no kms hook, which would carry every GPU's firmware (200 MB). btrfs is
# built into Arch's kernel.
MODULES=(i915)
HOOKS=(base systemd modconf keyboard block filesystems fsck)
COMPRESSION="zstd"
